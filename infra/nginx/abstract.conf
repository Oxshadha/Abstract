# nginx site for Abstract on a shared host (spec 017, D100). Copied to
# /etc/nginx/sites-available/abstract and linked into sites-enabled; certbot then adds the
# TLS listener and the HTTP-to-HTTPS redirect. One origin serves the web app and /api, so no
# CORS is needed between them.
server {
    listen 80;
    listen [::]:80;
    server_name abstract.oshadhakariyawasam.me;

    root /var/www/abstract;
    index index.html;

    # Ubuntu's mime.types has no .mjs; the pdf.js worker is an ES module and browsers refuse to
    # run it as application/octet-stream.
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json map;
        image/svg+xml svg;
        image/png png;
        image/webp webp;
        image/x-icon ico;
        font/woff2 woff2;
        font/woff woff;
        font/ttf ttf;
        video/mp4 mp4;
        text/plain txt;
        application/xml xml;
        application/wasm wasm;
        application/octet-stream bcmap pfb;
    }

    # Security headers (practices §3 Spec 017). The CSP is added under spec 017 AC2 once every
    # page has been checked against it in production. nginx drops these in a location that sets
    # its own add_header, which is why each location below repeats them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    # The API: JSON is small (uploads go straight to storage), streams must not be buffered.
    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Hashed build files never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # The app shell for the signed-in app and sign-in pages; never cached, so a deploy is seen.
    location ~ ^/(app|sign-in|sign-up)(/|$) {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files /app.html =404;
    }

    # The prerendered landing page and static files.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /app.html;
    }
}
