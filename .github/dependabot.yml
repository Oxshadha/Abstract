# Weekly dependency updates (spec 017 AC18). Grouped so a week's updates arrive as a few PRs,
# each of which must pass CI before it can merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: { interval: weekly, day: monday }
