name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_PROVIDER: fake  # CI never calls paid model APIs (spec 001 AC8)

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Conventional Commits, no co-author trailers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          scripts/check-commit-msg.sh --range "$RANGE"

  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - name: Tesseract for the OCR tests (spec 004 AC10)
        # Retries: runner DNS to the Ubuntu mirrors sometimes fails for a few minutes.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng \
              && exit 0
            echo "apt attempt $attempt failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - run: uv sync --frozen --group eval
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest  # integration tests use testcontainers (Docker is available on ubuntu runners)
      - name: Benchmark harness (lint, types, tests; no network, no paid calls)
        working-directory: eval
        run: |
          uv run --project ../apps/api --group eval ruff check .
          uv run --project ../apps/api --group eval ruff format --check .
          uv run --project ../apps/api --group eval mypy
          uv run --project ../apps/api --group eval pytest

  clamav:
    name: ClamAV adapter (EICAR, spec 004 AC16)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      clamav:
        image: clamav/clamav:1.4
        ports: ["3310:3310"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Wait for clamd (loads signatures on start)
        run: |
          for i in $(seq 1 60); do
            uv run python -c "import socket; s=socket.create_connection(('127.0.0.1',3310),2); s.sendall(b'zPING\0'); assert s.recv(16).startswith(b'PONG')" && exit 0
            sleep 5
          done
          exit 1
      - run: uv run pytest tests/integration/test_clamav.py -p no:cacheprovider
        env: { CLAMAV_HOST: 127.0.0.1 }

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: apps/web/package.json }  # pnpm version from packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Entry bundle within budget (spec 003 AC10)
        run: pnpm check:bundle
      - name: Content security policy allows the page shells (spec 017 AC2)
        run: pnpm check:csp
      - name: Built app never loads fonts from Google (spec 003 AC4)
        run: "! grep -rEl 'fonts\\.(googleapis|gstatic)\\.com' dist"
      - name: Design tokens are up to date (spec 003 AC1)
        run: |
          pnpm tokens
          git diff --exit-code -- src/styles/tokens.css src/styles/theme.css src/styles/tokens.ts
      - name: UI source rules (D62 text, 003 AC2 tokens only)
        working-directory: .
        run: |
          scripts/check-ui-text.sh --self-test
          scripts/check-ui-text.sh

  secrets:
    name: No secrets in git (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Scan the whole history (spec 017 AC18)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner

  migrations:
    name: Migrations on an empty database
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env: { POSTGRES_USER: abstract, POSTGRES_PASSWORD: abstract, POSTGRES_DB: abstract }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U abstract" --health-interval 5s --health-retries 20
    env:
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://abstract:abstract@localhost:5432/abstract
      DATABASE_URL: postgresql+asyncpg://abstract_app:abstract_app_dev@localhost:5432/abstract
      REDIS_URL: redis://localhost:6379/0
      S3_BUCKET: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Runtime roles, as on Neon (spec 002 AC6)
        run: PGPASSWORD=abstract psql -h localhost -U abstract -d abstract -v ON_ERROR_STOP=1 -q -f ../../infra/postgres/roles.sql
      - name: Upgrade an empty database to head (spec 017 AC9)
        run: uv run alembic upgrade head
      - name: Upgrading again is a no-op, and the database is at head
        run: |
          uv run alembic upgrade head
          test "$(uv run alembic current 2>/dev/null | awk '{print $1}')" = "$(uv run alembic heads 2>/dev/null | awk '{print $1}')"

  contract:
    name: API client is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: cd apps/api && uv sync --frozen
      - run: cd apps/web && pnpm install --frozen-lockfile
      - run: make api-client
      - name: Fail if generated client is stale
        run: git diff --exit-code -- apps/web/openapi.json apps/web/src/api/schema.d.ts

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: API image (prod target)
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          target: prod
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image (build target)
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          target: build
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
