[project]
name = "abstract-api"
version = "0.1.0"
description = "Abstract. research-paper assistant API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.127",
    "celery[redis]>=5.7.0",
    "fastapi>=0.162.4",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "langfuse==5.0.4",
    "pikepdf>=10",
    "pillow>=11",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "reportlab==5.1.0",
    "sentry-sdk[fastapi]>=2.74.0",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-socket>=0.8.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12,<6.0.12.20261001",
]
eval = [
    "pillow>=13.0.0",
    "pymupdf4llm>=2.1",
    "pypdfium2>=5.15.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
]
eval-docling = [
    "docling==2.144.0",
]
# Background table and figure parsing (spec 009, D85). Installed only in the enrichment worker
# image; CPU-only PyTorch on Linux keeps that image small (no CUDA libraries).
enrichment = [
    "docling==2.144.0",
    "torch==2.15.0",
    "torchvision==0.29.2",
]

[tool.uv]
package = false
# Dependencies must be at least two weeks old: the Docling family is held to releases before
# 2026-10-29, the date of docling 2.144.0.
exclude-newer-package = { docling = "2026-10-29T00:00:00Z", docling-core = "2026-10-29T00:00:00Z", docling-ibm-models = "2026-10-29T00:00:00Z", docling-parse = "2026-10-29T00:00:00Z" }

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "N802"]  # test_AC<n>_... names map to spec criteria

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = [
    "celery.*", "reportlab.*", "testcontainers.*", "boto3.*", "botocore.*", "pytest_socket.*",
    "pypdfium2.*", "pytesseract.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --disable-socket --allow-unix-socket"
markers = ["integration: needs Docker (testcontainers)"]
filterwarnings = ["ignore:A test tried to use socket:UserWarning"]
