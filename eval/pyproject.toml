# Tool config for the benchmark harness. It runs in the API's environment
# (uv run --project ../apps/api --group eval ...) so it can use the same LLMGateway port.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["../apps/api"]
files = ["harness", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "yaml.*", "pymupdf4llm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../apps/api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --disable-socket --allow-unix-socket -p no:cacheprovider"
